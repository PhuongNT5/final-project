[pytest]
# The project names files in kebab-case, which collides with pytest's default
# `test_*.py` glob: six files under tests/ (31 test functions covering crop geometry,
# ESTA alignment, feature ablation, the iSafetyBench dataset, shard-merge coverage and
# split-protocol modes) were never collected and only ran if invoked by path.
python_files = test_*.py test-*.py
testpaths = tests eval_utils/tests
